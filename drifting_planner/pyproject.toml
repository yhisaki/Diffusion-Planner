[project]
name = "drifting_planner"
version = "0.1.0"
description = "One-step trajectory generation using Drifting Models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "timm>=0.9.0",
    "wandb>=0.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drifting_planner*"]

[tool.setuptools.package-data]
drifting_planner = ["normalization.json"]
