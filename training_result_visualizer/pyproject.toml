[project]
name = "training_result_visualizer"
version = "0.1.0"
description = "Interactive visualization of Diffusion Planner predictions against GT"
requires-python = ">=3.10"
dependencies = [
    "diffusion-planner",
    "gradio>=6.14.0",
    "numpy>=2.0",
    "plotly>=6.0.0",
    "torch>=2.0.0",
    "training-data-visualizer",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["training_result_visualizer"]
package-dir = { "training_result_visualizer" = "." }

[project.scripts]
training_result_visualizer = "training_result_visualizer.app:main"
